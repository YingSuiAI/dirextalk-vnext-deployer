[package]
name = "dirextalk-vnext-deployer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
description = "Typed, fail-closed release and deployment CLI for Dirextalk vNext"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "dirextalk_vnext_deployer"
path = "src/lib.rs"

[[bin]]
name = "dirextalk-vnext-deployer"
path = "src/main.rs"

[dependencies]
aws-config = { version = "1.8.12", default-features = false, features = ["rt-tokio", "rustls"] }
aws-credential-types = "1.2.10"
aws-sdk-ec2 = "1.217.0"
aws-sdk-iam = "1.99.0"
aws-sdk-lightsail = "1.103.0"
aws-sdk-route53 = "1.100.0"
aws-sdk-sts = "1.99.0"
base64 = "0.22.1"
clap = { version = "4.6.2", features = ["derive"] }
csv = "1.3.1"
flate2 = "1.1.9"
hex = "0.4.3"
qrcode = { version = "0.14.1", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "time"] }
uuid = { version = "1.22.0", features = ["serde", "v4", "v7"] }
zip = { version = "8.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zeroize = "1.8.1"

[target.'cfg(unix)'.dependencies]
fs2 = "0.4.3"
rustix = { version = "1.1.4", features = ["fs", "process"] }
libc = "0.2.172"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
